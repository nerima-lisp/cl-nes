name: Set up Nix
description: Install Nix and optionally configure the shared Cachix cache.

inputs:
  cachix-cache:
    description: Cachix cache name.
    required: false
    default: ""
  cachix-auth-token:
    description: Cachix authentication token.
    required: false
    default: ""
  cachix-extra-pull-names:
    description: Comma-separated Cachix cache names to pull from.
    required: false
    default: ""
  cachix-skip-push:
    description: Skip pushing build results to Cachix.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
    - name: Configure Cachix
      if: ${{ inputs.cachix-cache != '' }}
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
      with:
        name: ${{ inputs.cachix-cache }}
        authToken: ${{ inputs.cachix-auth-token }}
        extraPullNames: ${{ inputs.cachix-extra-pull-names }}
        skipPush: ${{ inputs.cachix-skip-push }}
